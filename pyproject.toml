[project]
name = "feedback-llm"
version = "0.1.0"
description = "Operator-controlled audio feedback capture with local faster-whisper transcription."
requires-python = ">=3.10"
dependencies = [
    "sounddevice>=0.4.7",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "faster-whisper>=1.0.0",
    "huggingface-hub>=1.24.0",
    "tomli>=2.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
feedback-llm = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
